[project]
name = "kqbench"
version = "0.1.0"
description = "KQ performance harness orchestration and aggregation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kq-bench = "kqbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kqbench"]

[tool.pytest.ini_options]
testpaths = ["kqbench"]
