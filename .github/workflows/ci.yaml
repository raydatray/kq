name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy -diff
      - run: go vet ./...

  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0
      - run: |
          buf format --diff --exit-code
          buf lint
          buf build
      - run: |
          buf generate
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: sh test/integration/run.sh

  harness-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project bench python -m unittest kqbench.test_accounting -v

  performance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ready-success-v1
          - execution-latency-v1
          - permanent-failure-v1
          - temporary-outage-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv run --project bench kq-bench run \
            --scenario "${{ matrix.scenario }}" \
            --profile ci-smoke \
            --output artifacts/performance
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-${{ matrix.scenario }}
          path: artifacts/performance
